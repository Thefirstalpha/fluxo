# Mises à jour des dépendances — docs/planning/M0-fondations.md, lot B.
# Same 7-day delay as min-release-age in .npmrc: leaves time to detect a compromised release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    # Minor and patch updates in one PR; each major update gets its own PR.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) is not supported by typescript-eslint yet (ADR-008).
      - dependency-name: typescript
        versions: ['>= 7']

  - package-ecosystem: github-actions
    # Workflows (.github/workflows) and the local composite action.
    directories:
      - /
      - /.github/actions/setup-node-npm
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
