# OpenSSF Scorecard (résultats publiés pour le badge public) — docs/planning/M0-fondations.md, lot B.
# With publish_results, the job must keep this shape: no job-level env or defaults,
# no other actions than the ones below, read-only top-level permissions.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1' # Every Monday, 05:41 UTC.

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      contents: read
      actions: read
      # Upload the results to code scanning.
      security-events: write
      # Publish the results to the OpenSSF Scorecard API (badge).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@46dc3187a971a9febf3aeb7f94ccde489f7bb46a # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
