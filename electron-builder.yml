# Packaging & distribution — https://www.electron.build/
# Les secrets de signature ne sont jamais dans ce fichier : ils sont fournis par
# l'environnement de CI (voir .github/workflows/release.yml et docs/planning/M9-distribution.md).

# Identifiant confirmé par l'ADR-021 (docs/architecture/decisions.md) : il ne doit plus JAMAIS changer
# après la première release publique (mises à jour, données et raccourcis en dépendent).
appId: app.fluxo.desktop
productName: Fluxo
copyright: Copyright © 2026 Les contributeurs Fluxo

directories:
  buildResources: build
  output: release/${version}

# Seule la build est embarquée : tout le reste (sources, tests, docs) est exclu.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # Module natif SQLCipher (ADR-027) : seul le binaire précompilé de la plateforme et de
  # l'architecture cibles est embarqué ; ni les sources C (~10 Mo), ni les autres binaires.
  - '!node_modules/better-sqlite3-multiple-ciphers/{deps,src,binding.gyp,README.md}{,/**}'
  - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/!(${platform}-${arch}.node)'
  # En-têtes C++ utiles à la seule compilation.
  - '!node_modules/node-addon-api{,/**}'

# Licences livrées avec l'application (dossier resources/) : celle de Fluxo et celles des
# composants tiers embarqués. Electron conserve de son côté LICENSE.electron.txt et LICENSES.chromium.html.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

asar: true
# Aucune recompilation : le module natif passe par N-API et fournit ses binaires précompilés (ADR-027).
npmRebuild: false

# Légèreté : on ne garde que les locales Chromium utiles (~40 Mo économisés).
electronLanguages:
  - fr
  - en
  - en-US

# Durcissement du binaire Electron (https://www.electronjs.org/docs/latest/tutorial/fuses).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

win:
  executableName: Fluxo
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Fluxo
  uninstallDisplayName: Fluxo
  # Les données financières de l'utilisateur ne sont JAMAIS supprimées à la désinstallation.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

mac:
  category: public.app-category.finance
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false # Activé par la CI de release quand les identifiants Apple sont configurés.
  target:
    - target: dmg
      arch: [arm64, x64]

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  category: Office
  synopsis: Finances personnelles, en local et chiffrées.
  # Contact public : les tickets GitHub (aucune adresse e-mail publiée).
  maintainer: Fluxo contributors <https://github.com/Thefirstalpha/fluxo/issues>
  target:
    - AppImage
    - deb

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish:
  provider: github
  releaseType: draft
